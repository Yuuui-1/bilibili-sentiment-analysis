<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B站可视化分析平台</title>
    <style>
        :root { --pink: #FB7299; --pink-dark: #E05A7B; --pink-light: #FF9DB5; }
        body { font-family: 'Microsoft YaHei', sans-serif; margin: 0; padding: 0; background: #FFF9FA; }
        header {
            background: linear-gradient(135deg, var(--pink), var(--pink-dark));
            color: #fff; padding: .8rem 2rem; position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 8px rgba(251,114,153,0.2);
        }
        .header-wrap { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .header-wrap h1 { font-size: 1.2rem; margin: 0; }
        .header-wrap a { color: #fff; text-decoration: none; font-size: .85rem; background: rgba(255,255,255,.18); padding: 6px 16px; border-radius: 16px; transition: .2s; }
        .header-wrap a:hover { background: var(--pink-dark); }
        .chart-container { max-width: 1100px; margin: 20px auto; padding: 0 16px; background: #fff; border-radius: 14px; box-shadow: 0 2px 10px rgba(251,114,153,.06); overflow: hidden; }
        .chart-container > * { width: 100% !important; height: auto !important; }
    </style>
</head>
<body>
<header>
    <div class="header-wrap">
        <h1>B站可视化分析·{{ title }}</h1>
        <a href="/">← 返回首页</a>
    </div>
</header>
<div class="chart-container">
    {{ chart_html | safe }}
</div>
</body>
</html>
